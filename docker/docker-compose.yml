
services:
  # REVERSE PROXY - Caddy
  # Cloudflare Tunnel origin. TLS terminates at Cloudflare. The host port is
  # loopback-only, while the cloudflared container reaches Caddy through the
  # dedicated external cloudflare-net network.
  caddy:
    image: caddy:2-alpine
    container_name: pji-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      # NOTE: Caddyfile mounted from named volume `pji_caddy_config` to dodge
      # Docker Desktop fileshare cache on removable drives. Repopulate with:
      #   docker run --rm -i -v pji_caddy_config:/d alpine sh -c 'cat > /d/Caddyfile' < ../Caddyfile
      # On the production server (no fileshare cache), change back to:
      #   - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pji_caddy_config:/etc/caddy:ro
      - caddy_data:/data # SSL certificates
      - caddy_config:/config
    networks:
      - frontend-net
      - backend-net      # so Caddy can reverse_proxy minio:9000 for the minio.108pog.site site
      - monitoring-net   # so Caddy can reverse_proxy Grafana and observability services
      - cloudflare-net   # shared only with the separately managed cloudflared container
    depends_on:
      pji-frontend:
        condition: service_healthy
      pji-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "caddy", "version" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Fe - React/TypeScript
  pji-frontend:
    image: ${DOCKERHUB_REPO:-local}/pji-frontend:${IMAGE_TAG:-latest}
    container_name: pji-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - frontend-net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Be - Spring Boot
  pji-backend:
    image: ${DOCKERHUB_REPO:-local}/pji-backend:${IMAGE_TAG:-latest}
    container_name: pji-backend
    restart: unless-stopped
    # Port expose nội bộ, proxy vào
    expose:
      - "8085"
    environment:
      # Spring profiles
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pji_advisor}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pji_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password required}
      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?JWT secret required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?CORS origins required}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password required}

      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-pji_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RabbitMQ password required}

      # MinIO (binds to integration.minio.* in application.yaml)
      # INTEGRATION_MINIO_URL = internal endpoint backend uses for put/get/delete (Docker network)
      # INTEGRATION_MINIO_PUBLIC_URL = public endpoint baked into presigned URLs (browsers fetch this)
      INTEGRATION_MINIO_URL: ${INTEGRATION_MINIO_URL:-http://minio:9000}
      INTEGRATION_MINIO_PUBLIC_URL: ${INTEGRATION_MINIO_PUBLIC_URL:?Public MinIO URL required}
      INTEGRATION_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MinIO access key required}
      INTEGRATION_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MinIO secret key required}
      INTEGRATION_MINIO_PRESIGNED_EXPIRY_MINUTES: ${INTEGRATION_MINIO_PRESIGNED_EXPIRY_MINUTES:-60}
      MINIO_BUCKET: ${MINIO_BUCKET:-pji-documents}
      UPLOAD_SESSION_PUBLIC_WEB_URL: ${UPLOAD_SESSION_PUBLIC_WEB_URL:?Public frontend URL required}

      # Internal AI service URL
      AI_SERVICE_URL: http://pji-rag-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI service API key required}

      # Extract Images service — reachable on the Docker network at pji-extract-api:8000
      EXTRACT_IMAGES_URL: http://pji-extract-api:8000

      # SMTP for password recovery OTP email (MAIL_HOST binds to spring.mail.host)
      MAIL_HOST: ${MAIL_HOST:?SMTP host required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?SMTP username required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?SMTP password required}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      PASSWORD_RECOVERY_MAIL_FROM: ${PASSWORD_RECOVERY_MAIL_FROM:?Password recovery sender email required}
      DEVICE_VERIFICATION_MAIL_FROM: ${DEVICE_VERIFICATION_MAIL_FROM:-${PASSWORD_RECOVERY_MAIL_FROM}}
      PASSWORD_RECOVERY_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RECOVERY_REQUEST_COOLDOWN_SECONDS:-60}
      DEVICE_VERIFICATION_REQUEST_COOLDOWN_SECONDS: ${DEVICE_VERIFICATION_REQUEST_COOLDOWN_SECONDS:-60}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_CONNECT_TIMEOUT: ${CAPTCHA_CONNECT_TIMEOUT:-2s}
      CAPTCHA_READ_TIMEOUT: ${CAPTCHA_READ_TIMEOUT:-3s}

      # OpenTelemetry — Spring Micrometer OTLP exporter uses HTTP (port 4318), not gRPC (4317).
      # The /v1/traces path suffix is required by Spring's management.otlp.tracing.endpoint.
      OTEL_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: pji-backend
      OTEL_RESOURCE_ATTRIBUTES: "service.version=${IMAGE_TAG:-latest},deployment.environment=${SPRING_PROFILES_ACTIVE:-prod}"

      # Diagnostics (override in production by removing show-details=always)
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-never}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${HEALTH_MAIL_ENABLED:-true}

      # JVM options
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m -XX:+UseG1GC
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # Spring Boot cần thời gian khởi động
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '2.0'

  # RAG SERVICE - FastAPI (Adaptive RAG)
  pji-rag-service:
    image: ${DOCKERHUB_REPO:-local}/pji-rag-service:${IMAGE_TAG:-latest}
    container_name: pji-rag-service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # RabbitMQ — queue names must match Spring Boot RabbitMQConfig
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pji_user}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: pji.ai.exchange
      RABBITMQ_RECOMMENDATION_QUEUE: pji.ai.recommendation.queue
      RABBITMQ_RECOMMENDATION_RESULT_ROUTING_KEY: ai.recommendation.result

      # LLM — OpenRouter (matches Rag_Agentic/app/settings)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OpenRouter API key required}
      MAIN_MODEL: ${MAIN_MODEL:-deepseek/deepseek-chat}
      MAIN_MODEL_TEMPERATURE: ${MAIN_MODEL_TEMPERATURE:-0.1}
      FAST_MODEL: ${FAST_MODEL:-qwen/qwen-2.5-7b-instruct}
      FAST_MODEL_TEMPERATURE: ${FAST_MODEL_TEMPERATURE:-0.0}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      FAST_LLM_REQUEST_TIMEOUT_SECONDS: ${FAST_LLM_REQUEST_TIMEOUT_SECONDS:-60}
      FACTUAL_MODEL: ${FACTUAL_MODEL:-google/gemma-2-27b-it}
      ANALYTICAL_MODEL: ${ANALYTICAL_MODEL:-qwen/qwen-2.5-72b-instruct}
      OPINION_MODEL: ${OPINION_MODEL:-deepseek/deepseek-chat}
      CONTEXTUAL_MODEL: ${CONTEXTUAL_MODEL:-mistralai/mistral-large}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-openai/gpt-oss-120b}
      SYNTHESIS_MODEL_TEMPERATURE: ${SYNTHESIS_MODEL_TEMPERATURE:-0.1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      RERANK_MODEL: ${RERANK_MODEL:-cohere/rerank-v3.5}
      RERANK_TOP_N: ${RERANK_TOP_N:-5}

      # Vector DB — Qdrant
      QDRANT_URL: ${QDRANT_URL:?Qdrant URL required}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Qdrant API key required}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag-collection}

      # Retrieval
      RETRIEVAL_K: ${RETRIEVAL_K:-15}

      # Web search fallback
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # Langfuse observability
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-${IMAGE_TAG:-latest}}

      # API key auth — must match AI_SERVICE_API_KEY on pji-backend
      REQUIRE_API_KEY: "true"
      API_KEYS: ${AI_SERVICE_API_KEY:?AI service API key required}
      CORS_ORIGINS: '["${APP_CORS_ALLOWED_ORIGINS}"]'

      # RabbitMQ tuning
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-1}
      RABBITMQ_RECOMMENDATION_PROGRESS_ROUTING_KEY: ${RABBITMQ_RECOMMENDATION_PROGRESS_ROUTING_KEY:-ai.recommendation.progress}

      # Redis — shared with pji-backend for run-cancellation signaling.
      # Worker polls `cancel:run:<id>` between agent steps and aborts on hit.
      REDIS_URL: redis://:${REDIS_PASSWORD:?Redis password required}@redis:6379/0
      CANCEL_KEY_PREFIX: "cancel:run:"

      # HTTP rate limiting
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: pji-rag-service

      # Pydantic strict validation
      PYDANTIC_STRICT: "true"
    networks:
      - backend-net
      - rag-net
      - monitoring-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G # RAG + embeddings cần nhiều RAM
          cpus: '4.0'

  # =============================================================================
  # EXTRACT IMAGES - FastAPI extractor + RabbitMQ worker
  # =============================================================================
  pji-extract-api:
    image: ${DOCKERHUB_REPO:-local}/pji-extract-api:${IMAGE_TAG:-latest}
    container_name: pji-extract-api
    restart: unless-stopped
    command: uvicorn extractor.api.app:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pji_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RabbitMQ password required}
      RABBITMQ_QUEUE: ${EXTRACT_QUEUE:-image_processing}
      BASE_DIR: /app
      # Uploads + outputs MUST live on a volume shared with the worker. The API
      # writes uploaded images here and passes the path over RabbitMQ; the worker
      # reads them back and writes status/result JSON the API later polls.
      # Without this the default resolves under site-packages, per-container.
      UPLOAD_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: pji-extract-api
    volumes:
      - extract_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
      - rag-net
      - monitoring-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  pji-extract-worker:
    image: ${DOCKERHUB_REPO:-local}/pji-extract-worker:${IMAGE_TAG:-latest}
    container_name: pji-extract-worker
    restart: unless-stopped
    command: python -m extractor.worker.consumer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pji_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RabbitMQ password required}
      RABBITMQ_QUEUE: ${EXTRACT_QUEUE:-image_processing}
      BASE_DIR: /app
      # Same shared paths as pji-extract-api — see the note there.
      UPLOAD_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: pji-extract-worker
    volumes:
      - extract_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
      - rag-net
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
  

  # DATABASE - PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: pji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pji_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-pji_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password required}
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro # SQL init scripts (path relative to deploy root)
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pji_user} -d ${POSTGRES_DB:-pji_advisor}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    # Cấu hình thêm cho production
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c log_min_duration_statement=1000

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: pji-postgres-backup
    restart: unless-stopped
    # Run as root (the image's default). Docker auto-creates the ./backups
    # bind-mount as root:root, so a non-root `user: postgres` can't write to
    # /backups → "BACKUP_DIR ... insufficient permissions". pg_dump connects to
    # postgres over TCP, so the container user is irrelevant to the dump itself.
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pji_dev}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password required}
      POSTGRES_EXTRA_OPTS: "--no-owner --no-acl --quote-all-identifiers"
      SCHEDULE: "@daily" # runs at 04:00 UTC daily
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
  # CACHE - Redis
  redis:
    image: redis:7-alpine
    container_name: pji-redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?Redis password required}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MESSAGE BROKER - RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pji-rabbitmq
    restart: unless-stopped
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pji_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password required}
      RABBITMQ_DEFAULT_VHOST: /
      # Erlang cookie cho clustering sau này
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pji-secret-cookie}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      # Management UI - chỉ expose khi dev/debug, production nên bỏ
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      - backend-net
      - rag-net
      - monitoring-net # expose :15692 prometheus metrics to the otel-collector
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # OBJECT STORAGE - MinIO (file uploads)
  minio:
    image: minio/minio:latest
    container_name: pji-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MinIO access key required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MinIO secret key required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:?MinIO CORS origin required}
    volumes:
      - minio_data:/data
    ports:
      # Console UI - tương tự RabbitMQ, production nên restrict
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # METRICS EXPORTER - PostgreSQL → scraped by Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pji-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-pji_user}:${POSTGRES_PASSWORD:?Postgres password required}@postgres:5432/${POSTGRES_DB:-pji_advisor}?sslmode=disable"
    networks:
      - backend-net # reach postgres
      - monitoring-net # scraped by Prometheus
    depends_on:
      postgres:
        condition: service_healthy

  # METRICS EXPORTER - Redis → scraped by Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: pji-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password required}
    networks:
      - backend-net # reach redis
      - monitoring-net # scraped by Prometheus
    depends_on:
      redis:
        condition: service_healthy

  # =============================================================================
  # OBSERVABILITY - Prometheus / Alertmanager / Loki / Grafana / Jaeger
  # =============================================================================
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: pji-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - discord_webhook_url
    expose:
      - "9093"
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: pji-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-20GB}
      - --web.enable-lifecycle
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      alertmanager:
        condition: service_healthy
      pji-backend:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  loki:
    image: grafana/loki:3.7.3
    container_name: pji-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Read-only allow-list in front of the Docker daemon API. Alloy needs
  # container discovery and log reads, not daemon-wide socket access.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: pji-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - docker-socket-net
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: pji-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    depends_on:
      loki:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - monitoring-net
      - docker-socket-net
    environment:
      DEPLOYMENT_ENV: production
    healthcheck:
      test: [ "CMD", "/bin/alloy", "--version" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  jaeger-init:
    image: busybox:1.37
    container_name: pji-jaeger-init
    command: sh -c "mkdir -p /badger/keys /badger/values && chown -R 10001:10001 /badger"
    user: "0:0"
    volumes:
      - jaeger_data:/badger
    networks:
      - monitoring-net

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: pji-jaeger
    restart: unless-stopped
    command: [ "--config", "/etc/jaeger/config.yml" ]
    user: "10001:10001"
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    volumes:
      - ./docker/observability/jaeger/config.yml:/etc/jaeger/config.yml:ro
      - jaeger_data:/badger
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    expose:
      - "16686"
      - "4317"
      - "4318"
      - "8888"
      - "13133"
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:13133/status" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: pji-otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol/config.yml" ]
    volumes:
      - ./docker/observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    expose:
      - "4317"
      - "4318"
      - "8888"
      - "13133"
    depends_on:
      jaeger:
        condition: service_healthy
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:13133" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  grafana:
    image: grafana/grafana:13.1.0
    container_name: pji-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Grafana admin password required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.108pog.site}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - monitoring-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # =============================================================================
  # NETWORKS - security++
  # =============================================================================
networks:
  # Frontend: Caddy ↔ Frontend SPA ↔ Backend API
  frontend-net:
    driver: bridge

  # Backend: Backend ↔ PostgreSQL ↔ Redis ↔ MinIO ↔ RabbitMQ
  backend-net:
    driver: bridge

  # RAG: RAG Service ↔ RabbitMQ
  rag-net:
    driver: bridge

  # Monitoring: Prometheus / Loki / Grafana / Jaeger stack
  monitoring-net:
    driver: bridge

  # No host port and no external route: only Alloy can query the socket proxy.
  docker-socket-net:
    driver: bridge
    internal: true

  # Shared with the separately managed cloudflared container. Jenkins creates
  # it idempotently before deployment; cloudflared must join it persistently.
  cloudflare-net:
    external: true
    name: cloudflare-net

# VOLUMES - Persistent data
volumes:
  pji_caddy_config:
    external: true
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  rag_data:
  extract_data: # shared uploads/outputs between pji-extract-api and pji-extract-worker
  prometheus_data:
  loki_data:
  alloy_data:
  jaeger_data:
  grafana_data:
  alertmanager_data:

secrets:
  discord_webhook_url:
    file: ${DISCORD_WEBHOOK_URL_FILE:?Discord webhook secret file required}
