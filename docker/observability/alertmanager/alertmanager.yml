global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by:
    - alertname
    - job
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - job
      - instance

receivers:
  - name: discord
    discord_configs:
      - send_resolved: true
        webhook_url_file: /run/secrets/discord_webhook_url
        username: PJI Alertmanager
        title: >-
          [{{ .Status | toUpper }}][{{ .CommonLabels.severity | toUpper }}]
          {{ .CommonLabels.alertname }}
        message: |-
          **Environment:** production
          **Service/job:** {{ .CommonLabels.job }}
          {{ range .Alerts -}}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}
