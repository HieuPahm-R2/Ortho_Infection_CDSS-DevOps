<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Đang bảo trì — 108POG</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-inter">
  <section class="py-24 relative">
    <div class="w-full max-w-7xl px-4 md:px-5 lg:px-5 mx-auto">
      <div class="w-full flex-col justify-center items-center lg:gap-14 gap-10 inline-flex">
        <img src="assets/pog-logo.png" alt="108POG logo" class="object-contain h-32 md:h-40" />

        <div class="w-full flex-col justify-center items-center gap-3 flex">
          <div class="w-full flex-col justify-center items-center gap-6 flex">
            <div class="w-full flex-col justify-start items-center gap-2.5 flex">
              <h2 class="text-center text-gray-800 text-3xl font-bold font-manrope leading-normal">
                Xin lỗi về sự bất tiện này! Chúng tôi đang bảo trì hệ thống.
              </h2>
              <p class="text-center text-gray-500 text-base font-normal leading-relaxed">
                Sẽ mất một chút thời gian để hoàn thành công việc này. Chúng tôi sẽ khắc phục nhanh và thông báo cho bạn
                khi mọi thứ đã sẵn sàng!
              </p>
            </div>
            <div class="flex items-start justify-center w-full gap-1 count-down-main">
              <div class="timer">
                <div class="">
                  <h3
                    class="countdown-element hours text-center text-black text-3xl font-normal font-manrope leading-normal">
                  </h3>
                </div>
              </div>
              <h3 class="text-center text-black text-3xl font-normal font-manrope leading-normal">
                :
              </h3>
              <div class="timer">
                <div class="">
                  <h3
                    class="countdown-element minutes text-center text-black text-3xl font-normal font-manrope leading-normal">
                  </h3>
                </div>
              </div>
              <h3 class="text-center text-black text-3xl font-normal font-manrope leading-normal">
                :
              </h3>
              <div class="timer">
                <div class="">
                  <h3
                    class="countdown-element seconds text-center text-black text-3xl font-normal font-manrope leading-normal">
                  </h3>
                </div>
              </div>
            </div>
            <div class="w-full justify-center items-center gap-2.5 flex sm:flex-row flex-col">
              <input type="text"
                class="sm:w-80 w-full h-10 focus:outline-none text-gray-900 placeholder-gray-400 text-sm font-normal leading-relaxed px-3.5 py-2 rounded-lg shadow-[0px_1px_2px_0px_rgba(16,_24,_40,_0.05)] border border-gray-300"
                placeholder="Your mail" />
              <button
                class="sm:w-fit w-full px-3.5 py-2 bg-green-700 hover:bg-green-800 transition-all duration-700 ease-in-out rounded-lg shadow-[0px_1px_2px_0px_rgba(16,_24,_40,_0.05)] justify-center items-center flex">
                <span class="px-1.5 text-white text-sm font-medium leading-6 whitespace-nowrap">Nhắc tôi</span>
              </button>
            </div>
          </div>
          <img src="https://pagedone.io/asset/uploads/1718004199.png" alt="under maintenance image"
            class="object-cover" />
        </div>
      </div>
    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pagedone@1.1.2/src/js/pagedone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

  <!--Custom Script-->
  <script>
    // count-down timer: always 5 hours from the moment the visitor opens the page
    const COUNTDOWN_MS = 3 * 60 * 60 * 1000
    let dest = Date.now() + COUNTDOWN_MS
    let x = setInterval(function () {
      let diff = dest - Date.now()
      // Countdown finished — reload: if maintenance is over the user gets the
      // app back, otherwise the page restarts with a fresh 5h countdown.
      if (diff <= 0) {
        clearInterval(x)
        location.reload()
        return
      }

      let hours = Math.floor(diff / (1000 * 60 * 60))
      let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))
      let seconds = Math.floor((diff % (1000 * 60)) / 1000)

      if (hours < 10) {
        hours = `0${hours}`
      }
      if (minutes < 10) {
        minutes = `0${minutes}`
      }
      if (seconds < 10) {
        seconds = `0${seconds}`
      }

      // Get elements by class name
      let countdownElements = document.getElementsByClassName('countdown-element')

      // Loop through the elements and update their content
      for (let i = 0; i < countdownElements.length; i++) {
        let className = countdownElements[i].classList[1] // Get the second class name
        switch (className) {
          case 'hours':
            countdownElements[i].innerHTML = hours
            break
          case 'minutes':
            countdownElements[i].innerHTML = minutes
            break
          case 'seconds':
            countdownElements[i].innerHTML = seconds
            break
          default:
            break
        }
      }
    }, 10)
  </script>
</body>

</html>
