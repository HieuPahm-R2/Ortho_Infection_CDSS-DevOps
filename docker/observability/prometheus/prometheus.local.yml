global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: pji-advisor

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  - job_name: jaeger
    static_configs:
      - targets:
          - jaeger:8888

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: pji-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pji-backend:8085
        labels:
          service: pji-backend

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
