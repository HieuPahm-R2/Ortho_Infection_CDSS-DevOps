  rag-service:
    build:
      context: ../Rag_Agentic
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-hieupahmet}/rag-service:${IMAGE_TAG:-latest}
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../Rag_Agentic/.env
    environment:
      RABBITMQ_URL: amqp://admin:admin2026@rabbitmq:5672/
      # Redis — shared with pji-backend for run-cancellation signaling.
      # Local redis runs without auth, so no password segment.
      REDIS_URL: redis://redis:6379/0
      CANCEL_KEY_PREFIX: "cancel:run:"
      REQUIRE_API_KEY: "true"
      API_KEYS: ${AI_SERVICE_API_KEY:-dev-shared-key-pji-2026}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: rag-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      # pji-backend:
      #   condition: service_healthy
    networks:
      - pji-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # =============================================================================
  # EXTRACT IMAGES - FastAPI extractor + RabbitMQ worker
  # =============================================================================
  extract-api:
    build:
      context: ../Extract_Images
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-hieupahmet}/extract-api:${IMAGE_TAG:-latest}
    container_name: extract-api
    restart: unless-stopped
    command: uvicorn extractor.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - ../Extract_Images/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin2026
      RABBITMQ_QUEUE: ${EXTRACT_QUEUE:-image_processing}
      BASE_DIR: /app
      UPLOAD_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: extract-api
    volumes:
      - extract_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pji-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  extract-worker:
    build:
      context: ../Extract_Images
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-hieupahmet}/extract-worker:${IMAGE_TAG:-latest}
    container_name: extract-worker
    restart: unless-stopped
    command: python -m extractor.worker.consumer
    env_file:
      - ../Extract_Images/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin2026
      RABBITMQ_QUEUE: ${EXTRACT_QUEUE:-image_processing}
      BASE_DIR: /app
      UPLOAD_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: extract-worker
    volumes:
      - extract_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pji-network

  # =============================================================================
  # METRICS EXPORTER - PostgreSQL
  # =============================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: local-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://user:123456@postgresql:5432/pji_dev?sslmode=disable
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - pji-network

  # =============================================================================
  # VOICE INTERACTION - Base + Gateway + Orchestrator
  # voice-base is a build-only image consumed by gateway/orchestrator Dockerfiles
  # via `FROM voice-base:latest`. It runs `true` and exits — no long-running process.
  # =============================================================================


  # =============================================================================
  # OBSERVABILITY - Prometheus / Loki / Grafana / Jaeger
  # =============================================================================
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: local-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./docker/observability/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - pji-network

  loki:
    image: grafana/loki:3.7.3
    container_name: local-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - pji-network

  # Docker-only socket proxy. Retained as a reference for Docker Engine users.
  # docker-socket-proxy:
  #   image: tecnativa/docker-socket-proxy:v0.4.2
  #   container_name: local-docker-socket-proxy
  #   restart: unless-stopped
  #   environment:
  #     CONTAINERS: "1"
  #     INFO: "1"
  #     NETWORKS: "1"
  #     POST: "0"
  #     LOG_LEVEL: warning
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   expose:
  #     - "2375"
  #   networks:
  #     - docker-socket-net
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #     - /run
  #     - /var/lib/haproxy
  #   cap_drop:
  #     - ALL
  #   security_opt:
  #     - no-new-privileges:true
  #   healthcheck:
  #     test: [ "CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 5s

  # Podman serves a Docker-compatible API through its rootless socket. Override
  # PODMAN_SOCKET only when `podman system connection list` reports another URI.
  podman-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: local-podman-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - podman-socket-net
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: local-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/observability/alloy/config.podman.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_started
      podman-socket-proxy:
        condition: service_healthy
    environment:
      DEPLOYMENT_ENV: local
    networks:
      - pji-network
      - podman-socket-net

  jaeger-init:
    image: busybox:1.37
    container_name: local-jaeger-init
    command: sh -c "mkdir -p /badger/keys /badger/values && chown -R 10001:10001 /badger"
    user: "0:0"
    volumes:
      - jaeger_data:/badger
    networks:
      - pji-network

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: local-jaeger
    restart: unless-stopped
    command: [ "--config", "/etc/jaeger/config.yml" ]
    user: "10001:10001"
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    volumes:
      - ./docker/observability/jaeger/config.yml:/etc/jaeger/config.yml:ro
      - jaeger_data:/badger
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - pji-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: local-otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol/config.yml" ]
    volumes:
      - ./docker/observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
    networks:
      - pji-network

  grafana:
    image: grafana/grafana:13.1.0
    container_name: local-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: localadmin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - pji-network


volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  extract_data:
  prometheus_data:
  loki_data:
  alloy_data:
  jaeger_data:
  grafana_data:

networks:
  pji-network:
    driver: bridge
  # Docker-only network, retained with the commented Docker socket proxy above.
  # docker-socket-net:
  #   driver: bridge
  #   internal: true
  podman-socket-net:
    driver: bridge
    internal: true

