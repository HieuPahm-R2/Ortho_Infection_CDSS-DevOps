  #     AVATAR_STORAGE_BUCKET: user-avatars
  #     AI_SERVICE_URL: http://rag-service:8000
  #     AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-shared-key-pji-2026}
