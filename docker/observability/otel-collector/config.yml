extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 127.0.0.1:1777
  zpages:
    endpoint: 127.0.0.1:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  redaction:
    allow_all_keys: true
    redact_all_types: true
    blocked_key_patterns:
      - '(?i).*(authorization|cookie|password|passwd|secret|api.?key|access.?token|refresh.?token|patient|medical|diagnos|allerg|email|phone|address|request.?body|response.?body|gen_ai.prompt|gen_ai.completion|llm.prompts|llm.completions).*'
      - '(?i)^(db.statement|db.query.text|redis.command|mongodb.query|elasticsearch.body)$'
    blocked_values:
      - '(?i)bearer\s+[A-Za-z0-9._~+/-]+=*'
      - 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
      - 'https://discord(?:app)?\.com/api/webhooks/[^\s]+'
    summary: info
    url_sanitizer:
      enabled: true
      attributes:
        - http.url
        - url.full
        - url.original
      sanitize_span_name: true
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes:
            - ERROR
      - name: slow-traces
        type: latency
        latency:
          threshold_ms: 2000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  extensions:
    - health_check
    - pprof
    - zpages
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - redaction
        - tail_sampling
        - batch
      exporters:
        - otlp/jaeger
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
