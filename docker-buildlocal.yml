

services:
  postgresql:
    image: postgres:16.2
    container_name: pji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: pji_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pji_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pji-network

  redis:
    image: redis:7-alpine
    container_name: pji-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - pji-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: pji-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - pji-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pji-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin2026
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pji-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-service:
    build:
      context: ../Rag_Agentic
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-hieupahmet}/rag-service:${IMAGE_TAG:-latest}
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../Rag_Agentic/.env
    environment:
      RABBITMQ_URL: amqp://admin:admin2026@rabbitmq:5672/
      # Redis — shared with pji-backend for run-cancellation signaling.
      # Local redis runs without auth, so no password segment.
      REDIS_URL: redis://redis:6379/0
      CANCEL_KEY_PREFIX: "cancel:run:"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: rag-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pji-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # EXTRACT IMAGES - FastAPI extractor + RabbitMQ worker
  # =============================================================================
  extract-api:
    build:
      context: ../Extract_Images
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-hieupahmet}/extract-api:${IMAGE_TAG:-latest}
    container_name: extract-api
    restart: unless-stopped
    command: uvicorn extractor.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - ../Extract_Images/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin2026
      BASE_DIR: /app
      UPLOAD_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: extract-api
    volumes:
      - extract_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pji-network

  extract-worker:
    build:
      context: ../Extract_Images
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-hieupahmet}/extract-worker:${IMAGE_TAG:-latest}
    container_name: extract-worker
    restart: unless-stopped
    command: python -m extractor.worker.consumer
    env_file:
      - ../Extract_Images/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin2026
      BASE_DIR: /app
      UPLOAD_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: extract-worker
    volumes:
      - extract_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pji-network

  # =============================================================================
  # VOICE INTERACTION - Base + Gateway + Orchestrator
  # voice-base is a build-only image consumed by gateway/orchestrator Dockerfiles
  # via `FROM voice-base:latest`. It runs `true` and exits — no long-running process.
  # =============================================================================


  # =============================================================================
  # OBSERVABILITY - SigNoz (replaces Prometheus / Loki / Grafana / Jaeger)
  # =============================================================================


volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  extract_data:
  # signoz_zookeeper_data:
  # signoz_clickhouse_data:
  # signoz_alertmanager_data:
  # signoz_data:

networks:
  pji-network:
    driver: bridge

