global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    stack: pji-advisor

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: pji-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pji-backend:8085
        labels:
          service: pji-backend

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
        labels:
          service: rabbitmq

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
        labels:
          service: alloy

  - job_name: jaeger
    static_configs:
      - targets:
          - jaeger:8888
        labels:
          service: jaeger

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
        labels:
          service: otel-collector

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: alertmanager
