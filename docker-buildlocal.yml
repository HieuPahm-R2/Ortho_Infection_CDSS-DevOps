  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - pji-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
