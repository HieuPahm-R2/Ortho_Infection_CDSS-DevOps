  #     INTEGRATION_MINIO_PUBLIC_URL: ${INTEGRATION_MINIO_PUBLIC_URL:-http://${DEV_LAN_IP:-localhost}:9000}
  #     INTEGRATION_MINIO_ACCESS_KEY: admin
  #     INTEGRATION_MINIO_SECRET_KEY: admin2026
  #     INTEGRATION_MINIO_PRESIGNED_EXPIRY_MINUTES: 60
