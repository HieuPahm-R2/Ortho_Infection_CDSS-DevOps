  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  #     OTEL_SERVICE_NAME: pji-backend
  #     OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=local"
  #     JAVA_OPTS: -Xms256m -Xmx768m -XX:+UseG1GC
  #   depends_on:
